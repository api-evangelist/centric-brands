tools:
  - name: search_catalog
    category: catalog
    description: >-
      Search the store catalog with natural-language queries and/or structured
      filters; paginated. Implements dev.ucp.shopping.catalog.search.
  - name: lookup_catalog
    category: catalog
    description: >-
      Look up specific catalog items by identifier. Implements
      dev.ucp.shopping.catalog.lookup.
  - name: get_product
    category: catalog
    description: Retrieve a single product, including variants and options.
  - name: create_cart
    category: cart
    description: Create a cart from line items.
  - name: get_cart
    category: cart
    description: Read a cart including line items, totals, and discounts.
  - name: update_cart
    category: cart
    description: Add, remove, or change cart line items and buyer information.
  - name: cancel_cart
    category: cart
    description: Cancel/discard a cart.
  - name: create_checkout
    category: checkout
    description: Create a checkout from a cart or line items.
  - name: get_checkout
    category: checkout
    description: >-
      Read checkout details including line items, totals, discounts, and taxes.
      Prices are integers in ISO 4217 minor units paired with a currency code.
  - name: update_checkout
    category: checkout
    description: Set shipping address, shipping method, and buyer details on a checkout.
  - name: complete_checkout
    category: checkout
    description: >-
      Finalize a purchase. Requires contemporaneous buyer approval of payment —
      agents must not complete payment without explicit buyer consent.
  - name: cancel_checkout
    category: checkout
    description: Cancel an in-progress checkout.
  - name: get_order
    category: order
    description: Retrieve an order for tracking after checkout completion.
capabilities:
