notes: >-
  Centric Brands publishes no corporate developer program, but eight of its
  owned-brand direct-to-consumer storefronts run a live Universal Commerce
  Protocol (UCP) MCP server. tools/list was POSTed anonymously to each host on
  2026-08-13 and every one returned HTTP 200 with the same 13 UCP shopping tools
  and full JSON Schema inputs. Tool schemas are captured verbatim from
  www.hudsonjeans.com in centric-brands-ucp-mcp-tools.json.
  PROVENANCE: the server is Shopify platform infrastructure, not software Centric
  Brands authored — it is generated for every Shopify store on the 2026-04-08 UCP
  release. It is recorded here because it is genuinely reachable, unauthenticated,
  and served from hosts Centric Brands legally operates (see ownership below);
  it is NOT evidence of a Centric-built API program.
ownership: >-
  Each storefront's own privacy policy names a Centric operating entity — Hudson
  Jeans, Joe's Jeans and Favorite Daughter are "part of CENTRIC WEST LLC";
  Buffalo David Bitton and Avirex are "part of CENTRIC DENIM USA LLC"; Hervé
  Léger and Zac Posen are "part of CENTRIC FASHION LLC" (Zac Posen's Shopify
  handle is literally zac-posen-centric.myshopify.com). Avirex's terms of service
  state "Centric Denim USA LLC operates this website www.avirex.com". Avirex,
  Hudson and Robert Graham are additionally linked as owned brands from
  https://www.centricbrands.com/owned-brands.
